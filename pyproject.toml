[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitchhikers"
version = "0.1.0"
description = "Python client for the Kiwi Data API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kiwi Data", email = "fred@kiwidata.com" }]
keywords = ["kiwi", "document", "extraction", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "tenacity==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "black==26.5.1",
    "flake8==7.3.0",
    "radon==6.0.1",
    "pyright==1.1.409",
    "pip-audit==2.10.0",
]

[project.urls]
Homepage = "https://github.com/KiwiData-AI/hitchhikers"
Repository = "https://github.com/KiwiData-AI/hitchhikers"
Issues = "https://github.com/KiwiData-AI/hitchhikers/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.coverage.run]
source = ["src"]

