name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run flake8 src/ tests/

      - name: Format check
        run: uv run black --check src/ tests/

      - name: Test
        run: uv run pytest --cov=hitchhikers --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Dependency audit
        run: uv run pip-audit

      - name: Security + best practices
        if: ${{ hashFiles('.grimoire/config.yaml') != '' }}
        run: grimoire check --checks security,dep_audit,best_practices,duplicates,dead_code 2>/dev/null || true
