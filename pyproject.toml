[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitchhikers"
version = "0.1.0"
description = "Python client for the Kiwi Data API"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "black==26.5.1",
    "flake8==7.3.0",
    "radon==6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.coverage.run]
source = ["src"]

