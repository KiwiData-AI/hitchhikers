# Proposed external API contract for: add-dais-document-endpoints

kiwi_dais_api:
  action: add
  type: external_api
  provider: Kiwi DAIS
  schema_ref: https://api.neolicense.ai/api/v2/schema/
  client: src/hitchhikers/client.py

  endpoints:

    list_documents:
      method: GET
      path: /api/v2/dais/documents
      request:
        headers:
          X-API-Key: "{api_key}"
        query:
          limit: { type: integer, default: 100, nullable: false }
          offset: { type: integer, default: 0, nullable: false }
          doc_type: { type: string, nullable: true }
          business_partner_id: { type: uuid4, nullable: true }
          internal_legal_entity_id: { type: uuid4, nullable: true }
          start_date_gte: { type: date, nullable: true }
          end_date_lte: { type: date, nullable: true }
      response:
        items: { type: array, items: DocListRowOut, required: true }
        count: { type: integer, required: true }
      error_response:
        detail: { type: string }

    get_document:
      method: GET
      path: /api/v2/dais/documents/{document_id}
      request:
        headers:
          X-API-Key: "{api_key}"
        path_params:
          document_id: { type: uuid4, required: true }
      response:
        document_id: { type: uuid4, required: true }
        title: { type: string, required: true }
        state: { type: string, required: true }
        doc_type: { type: string, nullable: true }
        parent_document: { type: uuid4, nullable: true }
        children_docs: { type: array, items: uuid4 }
        start_date: { type: date, nullable: true }
        end_date: { type: date, nullable: true }
      error_response:
        detail: { type: string }

    get_document_attributes:
      method: GET
      path: /api/v2/dais/documents/{document_id}/attributes
      request:
        headers:
          X-API-Key: "{api_key}"
        path_params:
          document_id: { type: uuid4, required: true }
      response:
        type: array
        items:
          schema_name: { type: string, required: true }
          schema_version: { type: string, required: true }
          payload: { type: object, required: true }
          display_config: { type: object, nullable: true }
      error_response:
        detail: { type: string }

    upload_document:
      method: POST
      path: /api/v1/dais/document/
      request:
        headers:
          X-API-Key: "{api_key}"
          Content-Type: multipart/form-data
        body:
          file: { type: binary, required: true }
          title: { type: string, required: true, note: "client derives from filename when caller omits" }
          doctype_name: { type: string, nullable: true, note: "optional but recommended" }
          external_id: { type: string, nullable: true, note: "optional but recommended; maps to caller's system record" }
      response:
        document_id: { type: uuid4, required: true }
        title: { type: string, required: true }
        doctype_name: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        docstate_name: { type: string, nullable: true }
        process_status: { type: string, nullable: true }
        filename: { type: string, nullable: true }
        can_delete: { type: boolean, required: true }
      error_response:
        detail: { type: string, note: "raised as APIError on duplicate document submission" }

    get_transform_output:
      method: GET
      path: /api/v2/dais/documents/{document_id}/transform-output
      request:
        headers:
          X-API-Key: "{api_key}"
        path_params:
          document_id: { type: uuid4, required: true }
      response:
        type: any
        note: "arbitrary client-defined schema; shape varies by document type and configured transform"
      error_response:
        detail: { type: string }
